{% extends "base.html" %}
{% block title %}管理后台{% endblock %}
{% block content %}

<section class="page-head">
  <h1>🛠️ 管理后台</h1>
  <p>许愿处理 · 运营数据 · 操作留痕</p>
</section>

<div class="stat-row">
  <div class="stat-card"><span id="st-users">—</span><label>注册用户</label></div>
  <div class="stat-card"><span id="st-wishes">—</span><label>愿望总数</label></div>
  <div class="stat-card"><span id="st-pending">—</span><label>待评估</label></div>
  <div class="stat-card"><span id="st-accepted">—</span><label>已立项</label></div>
</div>

<div class="admin-grid">
  <div class="admin-card">
    <h3>📋 愿望处理</h3>
    <p class="admin-tip">点击状态直接修改；删除不可恢复</p>
    <div id="admin-wishes" class="admin-list"><div class="empty">加载中…</div></div>
  </div>
  <div class="admin-card">
    <h3>🧾 操作日志 <small>（最近100条）</small></h3>
    <div id="admin-logs" class="log-list"><div class="empty">加载中…</div></div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const STATUS = {{ wish_status | tojson }};

async function loadAll(){
  const [ov, wl, lg] = await Promise.all([
    api('/api/admin/overview'),
    api('/api/wishes'),
    api('/api/admin/logs')
  ]);
  if(ov.ok){
    document.getElementById('st-users').textContent = ov.stats.users;
    document.getElementById('st-wishes').textContent = ov.stats.wishes;
    document.getElementById('st-pending').textContent = ov.stats.pending;
    document.getElementById('st-accepted').textContent = ov.stats.accepted;
  }
  const wbox = document.getElementById('admin-wishes');
  if(wl.ok && wl.wishes.length){
    wbox.innerHTML = wl.wishes.map(w => `
      <div class="aw-item">
        <div class="aw-top">
          <span class="wi-product">${w.product}</span>
          <span class="wi-meta">#${w.id} · ${w.nickname||'匿名'} · ${w.created_at.slice(0,10)}</span>
        </div>
        <p class="wi-content">${escapeHtml(w.content)}</p>
        <div class="aw-bottom">
          <select onchange="setStatus(${w.id}, this.value)">
            ${STATUS.map(s=>`<option ${s===w.status?'selected':''}>${s}</option>`).join('')}
          </select>
          <span class="wi-contact">📞 ${escapeHtml(w.contact)}</span>
          <a href="javascript:void(0)" class="danger" onclick="delWish(${w.id})">删除</a>
        </div>
      </div>`).join('');
  } else {
    wbox.innerHTML = '<div class="empty">暂无愿望</div>';
  }
  const lbox = document.getElementById('admin-logs');
  if(lg.ok && lg.logs.length){
    lbox.innerHTML = lg.logs.map(l => `
      <div class="log-item">
        <span class="log-time">${l.created_at}</span>
        <span class="log-user">${l.nickname||'游客'}</span>
        <span class="log-action">${l.action}</span>
        <span class="log-detail">${escapeHtml(l.detail||'')}</span>
      </div>`).join('');
  } else {
    lbox.innerHTML = '<div class="empty">暂无日志</div>';
  }
}
async function setStatus(id, status){
  const d = await api('/api/wishes/'+id, {method:'PUT', body: JSON.stringify({status})});
  if(d.ok){ toast('已更新为：'+status); loadAll(); }
}
async function delWish(id){
  if(!confirm('确定删除该愿望？不可恢复')) return;
  const d = await api('/api/wishes/'+id, {method:'DELETE'});
  if(d.ok){ toast('已删除'); loadAll(); }
}
function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
loadAll();
</script>
{% endblock %}
